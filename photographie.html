<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio photographique : portraits, paysages et photographie de rue.">
    <title>Photographie</title>
    <link rel="stylesheet" href="photographie.css" />
    <script src="photographie.js"defer></script>
</head>

<body>

    <header>

        <div class="navbar">
            <nav class="menu">
                <a href="index.html" id="Accueil">Accueil</a>
                <a href="photographie.html" id="Photo">Photographie</a>
                <a href="projet.html" id="Projet">Projet</a>
            </nav>

            <div class="contrôles">
                <label class="bouton">
                    <label class="interrupteur">
                        <input type="checkbox" id="interrupteurSombre" onchange="basculerTheme()" />
                        <span class="curseur"></span>
                    </label>
                    <span id="texte-sombre">Thème sombre</span>
                </label>
                <button class="bouton-langue" onclick="basculerLangue()">🇬🇧 Passer en Anglais</button>
            </div>
        </div>
    </header>

    <nav id="filters">
        <button class="active" data-filter="tout" id="filtre-tout">Tout</button>
        <button data-filter="portrait" id="filtre-portrait">Portrait</button>
        <button data-filter="paysage" id="filtre-paysage">Paysage</button>
        <button data-filter="rue" id="filtre-rue">Rue</button>
        <button data-filter="animaux" id="filtre-animaux">Animaux</button>
    </nav>
    </header>

    <section class="galerie" id="galerie">

        <figure data-cat="portrait">
            <img src="Photo/IMG_0661.jpg" alt="Photo de grand-mère coréenne" loading="lazy">
            <figcaption>Portrait d'une grand-mère coréenne</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/Mamie 1.jpg" alt="Mamie qui travaille" loading="lazy">
            <figcaption>Grand-mère coréenne au travail</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/Spidy pêcheur1.jpg" alt="pêcheur" loading="lazy">
            <figcaption>Portrait d'un pêcheur coréen 1</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/Spidy pêcheur2.jpg" alt="pêcheur" loading="lazy">
            <figcaption>Portrait d'un pêcheur coréen 2</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/Spidy pêcheur3.jpg" alt="pêcheur" loading="lazy">
            <figcaption>Portrait d'un pêcheur coréen 3</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/Papi resto.jpg" alt="Photo de grand-père coréenne" loading="lazy">
            <figcaption>Portrait d'un grand père coréen</figcaption>
        </figure>

        <figure data-cat="paysage">
            <img src="Photo/Paysage.jpg" alt="Paysage coréen" loading="lazy">
            <figcaption>Paysage de Corée — 02</figcaption>
        </figure>

        <figure data-cat="rue">
            <img src="Photo/20260426_171856.jpg" alt="Rue" loading="lazy">
            <figcaption>Rue — 02</figcaption>
        </figure>

        <figure data-cat="animaux">
            <img src="Photo/IMG_0333.jpg" alt="Mon chien" loading="lazy">
            <figcaption>Photo chien et fleur</figcaption>
        </figure>

        <figure data-cat="rue">
            <img src="Photo/20260510_122855.jpg" alt="Photo de rue en Corée" loading="lazy">
            <figcaption>Rue coréenne</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/Capture d'écran 2026-03-26 151321.png" alt="Euphoria style portrait" loading="lazy">
            <figcaption>Portrait style euphoria 1</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/Capture d'écran 2026-03-26 151351.png" alt="Euphoria style portrait" loading="lazy">
            <figcaption>Portrait style euphoria 2</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/Capture d'écran 2026-03-26 151406.png" alt="Euphoria style portrait" loading="lazy">
            <figcaption>Portrait style euphoria 3</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/CHLOE 1.png" alt="Euphoria style portrait" loading="lazy">
            <figcaption>Portrait style euphoria 4</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/CHLOE 2.png" alt="Euphoria style portrait" loading="lazy">
            <figcaption>Portrait style euphoria 5</figcaption>
        </figure>

        <figure data-cat="portrait">
            <img src="Photo/CHLOE 3.png" alt="Euphoria style portrait" loading="lazy">
            <figcaption>Portrait style euphoria 4</figcaption>
        </figure>
    </section>

    <div class="ZoomPhoto" id="ZoomPhoto">
        <button class="boutonFermer" id="ZoomPhotoClose" aria-label="Fermer">✕</button>
        <button class="boutonAvant" id="photoAvant" aria-label="Image précédente">‹</button>
        <img id="ZoomPhotoImg" src="" alt="">
        <figcaption id="ZoomPhotoDescription"></figcaption>
        <button class="boutonApres" id="photoAprès" aria-label="Image suivante">›</button>
    </div>
    <footer>
        <section>
            <a href="mentionslégales.html"> Mentions légales</a>
                <p>
                    Site édité par Virgil Cantin
                    Hébergement sur GitHub Pages.
                </p>
        </section>
    </footer>
</body>

</html>
